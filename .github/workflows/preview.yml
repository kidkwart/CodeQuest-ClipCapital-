name: Deploy Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: dist
          retention-days: 7
      - name: Mark Preview deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              environment: 'Preview',
              auto_merge: false,
              required_contexts: [],
              description: `Preview build for PR #${context.issue.number}`
            });
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: `https://${owner}.github.io/${repo}/`,
              description: 'Preview build succeeded'
            });
